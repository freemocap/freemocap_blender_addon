name: Build standalone Blender release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blender-packages-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ['3.0', '3.6', '4.2', '4.5', '5.2']
        # Expand after runtime acceptance, not merely wheel acquisition.
        platform: ['windows-x64']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify offline package contracts
        run: python -B -m tools.run_tests --unit-only
      - name: Build with pinned wheels
        run: python -B -m tools.build_release --target '${{ matrix.target }}' --platform '${{ matrix.platform }}' --download
      - uses: actions/upload-artifact@v4
        with:
          name: blender-${{ matrix.target }}-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: blender-*
          path: packages
          merge-multiple: true
      - name: Describe immutable release packages for FreeMoCap
        env:
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: python -B -m tools.package_catalog --directory packages --base-url "$RELEASE_URL"
      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          draft: true
          files: |
            packages/*.zip
            packages/package-catalog.json
          fail_on_unmatched_files: true
          body: |
            Complete Blender packages with bundled dependencies. Select the archive
            matching your Blender series and operating system. Blender 4.2+ archives
            are Extensions; older archives are legacy add-ons. These are release
            candidates pending human review, not an official Extensions submission.
